name: CI

# Quality gate. Runs on every push and pull request to main, on all three
# target platforms — the audio backend differs per OS (WASAPI / ALSA /
# CoreAudio), so compiling on one proves nothing about the others.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # reused by release.yml as its gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # Tauri links against the system WebView, and cpal against ALSA.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lints
        working-directory: src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib
