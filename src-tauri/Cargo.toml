[package]
name = "horriplayer"
version = "0.1.0"
description = "HorriPlayer — local files + Subsonic/Navidrome desktop client"
authors = ["pirnox"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "blocking"] }
symphonia = { version = "0.5.5", features = ["aac", "alac", "flac", "isomp4", "mp3", "pcm", "vorbis", "ogg", "wav", "aiff", "caf", "adpcm", "mkv"] }
cpal = "0.17.1"
rtrb = "0.3.4"
rubato = "0.16"
realfft = "3.5.0"
tauri-plugin-dialog = "2.7.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
